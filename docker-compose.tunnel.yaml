# nginx proxy address - http://172.17.0.1:64240
name: loki
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: grafana/loki:latest
    container_name: loki-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    command: -config.file=/etc/loki/loki.yaml
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: loki-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - './volumes/config/loki/loki.yaml:/etc/loki/loki.yaml:ro'
      - './volumes/data/loki:/loki'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://loki-app:3100'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - loki
      - cloudflare

networks:
  loki:
    name: loki
    external: false
  cloudflare:
    external: true
